# Runs on every pull request: if the site doesn't build or fails the safety checks,
# the PR shows a red cross and shouldn't be merged. Nothing is published from here.
# Owner: Arya.
name: PR check

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

# A new push to the same PR cancels the old, now-outdated check.
concurrency:
  group: pr-check-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-check:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Get the code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: npm

      - name: Install exact dependency versions
        run: npm ci

      - name: Check dependencies for known vulnerabilities
        run: npm audit --audit-level=high

      - name: Build the site into dist/
        run: npm run build

      - name: Safety checks
        run: npm run check
