# Looks for leaked passwords, API keys and tokens in the code and its history.
# If it finds one, the check goes red. Then: revoke/rotate the key at the provider FIRST
# (deleting it from the code is not enough: it stays in git history), and tell the team.
# Owner: Arya. Uses TruffleHog (open source, no licence key needed), pinned to an exact version.
name: Secret scan

on:
  pull_request:
  push:
    branches: [main]
  schedule:
    - cron: "30 3 * * 1" # every Monday 09:00 IST: scan the whole history
  workflow_dispatch:

permissions:
  contents: read

jobs:
  secret-scan:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Get the code (full history)
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Scan for secrets
        uses: trufflesecurity/trufflehog@3bd2b5887eb0efb8fa18bfd1d296032924e4ffdc # v3.99.9
        with:
          version: 3.99.9 # pin the scanner image too (the default is "latest")
          extra_args: --results=verified,unknown
